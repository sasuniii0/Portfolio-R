<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Sasuni Wijerathne | Portfolio</title>
    <meta name="description" content="Sasuni Wijerathne - Software Engineer | AI, ML, Web Development Portfolio showcasing projects, blogs, and contact information." />
    <meta name="author" content="Sasuni Wijerathne" />
    
    <!-- Social Media SEO -->
    <meta property="og:title" content="Sasuni Wijerathne | Portfolio" />
    <meta property="og:description" content="Explore my projects, blogs, and get in touch for collaborations in AI, ML, and web development." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon-192.png" /> <!-- Replace with your image -->
    <meta property="og:url" content="https://www.sasuni.me/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sasuni Wijerathne | Portfolio" />
    <meta name="twitter:description" content="Explore my projects, blogs, and get in touch for collaborations in AI, ML, and web development." />
    <meta name="twitter:image" content="/favicon-192.png" /> <!-- Replace with your image -->

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#08090a" />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <style>
      body { background: #08090a; margin: 0; }

      /* ===== Loader ===== */
      #loader { background: #08090a; transition: opacity 0.5s ease-out; }
      .loader-ring {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: #7170ff;
        animation: loader-spin 0.7s linear infinite;
      }
      @keyframes loader-spin { to { transform: rotate(360deg); } }
      #loader.fade-out { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- ============== LOADING SCREEN ============== -->
    <div id="loader" class="fixed inset-0 flex items-center justify-center z-50">
      <div class="loader-ring"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
        <script type="text/javascript"
            src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
    </script>
    <script type="text/javascript">
      (function(){
          emailjs.init({
            publicKey: "service_yiwpasf",
          });
      })();

      // Remove loader after React + assets load
      window.addEventListener("load", () => {
          const loader = document.getElementById("loader");
          setTimeout(() => {
            loader.classList.add("fade-out");
            setTimeout(() => loader.remove(), 500);
          }, 200);
      });
    </script>
  </body>
</html>
